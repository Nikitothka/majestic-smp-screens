# ============================================================
#  ИГРОВЫЕ ФРАЗЫ. {id} — номер игрока (#12345). Сопоставление нечёткое,
#  пара перепутанных OCR букв не мешает. Добавить фразу — дописать строку.
# ============================================================

# Плашки внизу по центру. Именно они определяют действие.
toasts:
  revive:
    - "Вы реанимировали #{id}"
  heal:
    - "Вы вылечили #{id}"
  vaccinate:
    - "Вы вакцинировали #{id}"
  certificate:        # заготовка — примеров пока не было
    - "Вы выдали медсправку #{id}"
    - "Вы выдали медицинскую справку #{id}"
  call_cancelled:
    - 'Вызов от #{id} по причине "Смерть" был отменён!'

# Плашки, у которых середина меняется (причина вызова бывает разной).
# Засчитывается, если в строке есть ВСЕ перечисленные куски. Нечувствительно к регистру
# и к мусору между кусками — поэтому переживает и кривой OCR, и новую причину вызова.
toasts_contains:
  call_cancelled:
    - ["вызов от", "отмен"]

# Если в кадре сразу несколько плашек, побеждает действие, которое выше в списке.
# Отменённый вызов — самое слабое: если в том же кадре видно реанимацию, кадр про неё.
priority:
  - revive
  - heal
  - vaccinate
  - certificate
  - call_cancelled

# Подтверждающие плашки: сами по себе действием не являются, но подкрепляют его.
supporting:
  revive_reward: "Вы получили 750 ₽ за спасение игрока"
  refused:       "#{id} отказался от лечения"
  macro_playing: "Этот макрос уже проигрывается!"

# Строки чата — контекст кейса (что делали до плашки).
chat:
  first_aid_start: "начал оказывать первую медицинскую помощь для #{id}"
  gave_medicine:   "взял необходимый лекарственный препарат и передал #{id}"
  stethoscope:     "послушал в стетоскоп чтобы диагностировать болезнь у #{id}"
  bandage:         "#{id} достал бинт и начал перевязывать рану"

# Панель личного вызова слева
call_panel:
  header: "Личный вызов"
  citizen: "Гражданин #{id}"
  reason:  "Причина:"
